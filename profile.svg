<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background-color: #1a1b26; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; color: #c0caf5;">
  <style>
    .cyan { fill: #7dcfff; }
    .green { fill: #9ece6a; }
    .yellow { fill: #e0af68; }
    .red { fill: #f7768e; }
    .magenta { fill: #bb9af7; }
    .white { fill: #c0caf5; }
