<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background-color: #0d1117; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; color: #c9d1d9;">
  <style>
    .cyan { fill: #58a6ff; }
    .green { fill: #3fb950; }
    .yellow { fill: #d29922; }
    .red { fill: #f85149; }
    .magenta { fill: #d2a8ff; }
    .white { fill: #c9d1d9; }
    .gray { fill: #8b949e; }
    .darkgray { fill: #21262d; }
    .orange { fill: #db6d28; }
    .key { fill: #58a6ff; font-weight: bold; }
    .val { fill: #f0883e; }
    .sep { fill: #30363d; }
    .stat { fill: #c9d1d9; }
    .highlight { fill: #ff7b72; }
  </style>

  <!-- Fundo estilo GitHub Dark -->
  <rect width="1100" height="650" fill="#0d1117" />

  <!-- ================= COLUNA ESQUERDA: ASCII ART REALISTA (MÃO E ROSTO) ================= -->
  <g transform="translate(20, 60)" font-size="10" letter-spacing="1" font-weight="bold">
    <!-- Mão (Parte superior cinza escuro, pontos e % para textura) -->
    <text x="100" y="20" class="gray">........................</text>
    <text x="110" y="32" class="gray">.::::::..........:::</text>
    <text x="80" y="44" class="gray">:::::::::....::..:::::::::</text>
    <text x="60" y="56" class="gray">:::::::::::...:::.::::::::::</text>
    <text x="40" y="68" class="darkgray">.:::::::::::::..::::::::::::::::::</text>
    <text x="30" y="80" class="darkgray">..::::::::::::...::::::::::::::::::</text>
    <text x="20" y="92" class="darkgray">::.::::::::::::....:::::::::::::::::::</text>
    
    <!-- Dedos estendidos (ponta dos dedos, tons mais claros) -->
    <text x="220" y="56" class="white">@@@@@@@@@@@@</text>
    <text x="200" y="68" class="white">@@@@@@@@@@@@@@@@@@@</text>
    <text x="180" y="80" class="white">@@@@@@@@@@@@@@@@@@@@@@@</text>
    <text x="130" y="92" class="white">@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
    
    <!-- Corpo da mão e punho (transição de @ para % e #) -->
    <text x="90" y="104" class="white">@@@@@@@@@@@@@@@@@@@@@%%%######</text>
    <text x="70" y="116" class="white">@@@@@@@@@@@@@@@@@@@%%%%%%%%%%%%</text>
    <text x="50" y="128" class="yellow">%%%@@@@@@@@@@@@@@@%%%%%%%%%%%%%%</text>
    <text x="40" y="140" class="yellow">%%%%%%%%@@@@@@@@@@%%%%%%%%%%%%%%</text>
    <text x="40" y="152" class="magenta">%%%%%%%%%%%@@@@@@%%%%%%%%%%%%%%</text>

    <!-- Dedo indicador e polegar (separação) -->
    <text x="140" y="116" class="gray">::::::</text>
    <text x="120" y="128" class="gray">::::::::</text>
    <text x="100" y="140" class="gray">:::::::::::</text>
    
    <!-- Rosto e olhos (parte inferior, tons de cinza para o capuz e rosto) -->
    <text x="60" y="164" class="darkgray">#############@@@@@@@@@@@##############</text>
    <text x="50" y="176" class="darkgray">###########@@@@@@@@@@@@@@############</text>
    <text x="50" y="188" class="darkgray">#######@@@@@@@@@@@@@@@@@@############</text>
    
    <!-- Olhos (mais claros) -->
    <text x="140" y="176" class="white">.::.</text>
    <text x="175" y="176" class="white">.::.</text>
    
    <!-- Contorno do rosto abaixo dos olhos -->
    <text x="60" y="200" class="darkgray">####@@@@@@@@@@@@@@@@@@@@@@@##########</text>
    <text x="70" y="212" class="darkgray">####@@@@@@@@@@@@@@@@@@@########</text>
    <text x="80" y="224" class="darkgray">####@@@@@@@@@@@@@@@@@@@######</text>
    
    <!-- Pescoço / Capuz (fundo escuro) -->
    <text x="100" y="236" class="gray">################################</text>
    <text x="120" y="248" class="gray">################################</text>
    <text x="140" y="260" class="gray">################################</text>
    <text x="150" y="272" class="gray">################################</text>
    <text x="160" y="284" class="gray">################################</text>
    <text x="170" y="296" class="gray">################################</text>
    
    <!-- Rodapé da arte -->
    <text x="180" y="308" class="gray">###</text>
  </g>

  <!-- ================= COLUNA DIREITA: INFORMAÇÕES ================= -->
  <g transform="translate(400, 65)" font-size="13">
    
    <!-- Cabeçalho -->
    <text x="0" y="25" class="cyan">mumitacho@profile</text>
    <text x="210" y="25" class="gray">----------------------------</text>
    
    <!-- OS -->
    <text x="0" y="55" class="key">Sistema:</text>
    <text x="210" y="55" class="val">Windows 11 / Ubuntu (WSL)</text>
    
    <!-- Uptime -->
    <text x="0" y="75" class="key">Tempo de atuação:</text>
