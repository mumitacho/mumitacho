    <text x="210" y="215" class="val">Delphi, PHP, React, N8N</text>
    
    <!-- Idiomas -->
    <text x="0" y="235" class="key">Linguagens.Faladas:</text>
    <text x="210" y="235" class="val">Português (Nativo), Inglês (Intermed.)</text>

    <!-- Hobbies -->
    <text x="0" y="265" class="key">Hobbies.Software:</text>
    <text x="210" y="265" class="val">Data Science, IA, Marketing Digital</text>
    
    <text x="0" y="285" class="key">Hobbies.Criativo:</text>
    <text x="210" y="285" class="val">Edição de Vídeo, Direct Response</text>
    
    <text x="0" y="305" class="key">Hobbies.Dados:</text>
    <text x="210" y="305" class="val">SQL, Power BI, Automação (N8N)</text>

    <!-- Linha divisória -->
    <text x="0" y="335" class="sep">---------------------------------------</text>

    <!-- Contato -->
    <text x="0" y="365" class="key">Portfólio.Link:</text>
    <text x="210" y="365" class="val">munitacho.com.br</text>
    
    <text x="0" y="385" class="key">E-mail.Contato:</text>
    <text x="210" y="385" class="val">luisgustavo_peetre@hotmail.com</text>
    
    <text x="0" y="405" class="key">Instagram:</text>
    <text x="210" y="405" class="val">@mumitacho</text>
    
    <text x="0" y="425" class="key">GitHub:</text>
    <text x="210" y="425" class="val">github.com/mumitacho</text>

    <!-- Linha divisória -->
    <text x="0" y="455" class="sep">---------------------------------------</text>

    <!-- GitHub Stats Reais -->
    <text x="0" y="485" class="key">GitHub Stats:</text>
    
    <text x="0" y="510" class="key">Repos:</text>
    <text x="80" y="510" class="stat">1</text>
    <text x="130" y="510" class="key">Stars:</text>
    <text x="180" y="510" class="stat">0</text>

    <text x="0" y="530" class="key">Commits:</text>
    <text x="80" y="530" class="stat">0</text>
    <text x="130" y="530" class="key">Seguidores:</text>
    <text x="210" y="530" class="stat">0</text>
    
    <!-- Formação -->
    <text x="0" y="560" class="key">Acadêmico:</text>
    <text x="80" y="560" class="highlight">USP (MBA IA), Anhanguera, Unopar, Castaldi</text>

  </g>
</svg>
