    .yellow { fill: #d29922; }
    .green { fill: #3fb950; }
    .red { fill: #f85149; }
    .magenta { fill: #d2a8ff; }
    .gray { fill: #8b949e; }
    .white { fill: #c9d1d9; }
    .orange { fill: #db6d28; }
    .key { fill: #58a6ff; font-weight: bold; }
    .val { fill: #f0883e; }
    .sep { fill: #30363d; }
