<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background-color: #0d1117; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;">
  <style>
